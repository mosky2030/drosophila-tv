org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Local dev env only: Aerial requires JDK 17 while Android Studio 2026.2.2 ships JBR 25.
# Keep the Gradle daemon on Temurin 17 regardless of which JDK the IDE itself runs on.
#
# ⚠ 机器相关的路径不要写在这个文件里——它是进仓库的，写死了别人的机器就编不了。
# 真要指定 JDK 17，写到**全局**的那份：
#   Windows: C:\Users\<你>\.gradle\gradle.properties
#   macOS  : ~/.gradle/gradle.properties
# 内容一行：
#   org.gradle.java.home=<你的 JDK 17 路径>
#   Windows 那台（本机）：D:/WorkBuddyData/2026-11-12-18-45-54/android-env/jdk/jdk-17.0.21+9
#   macOS（Homebrew 装的）：/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
# 不写也能编：终端里 export JAVA_HOME=<JDK17> 之后跑 ./gradlew 就行；只有从 Android Studio 里
# 触发构建时（IDE 自带的是 JBR 25）才必须靠上面那行把它按回 17。
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
